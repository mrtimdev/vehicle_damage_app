name: vehicle_damage_analyzer
description: >
  A Flutter app for AI-assisted vehicle damage analysis. Users can capture,
  record, or upload photos/videos of a vehicle and send them to a
  user-configured AI provider (OpenAI, Anthropic, Gemini, or a custom
  self-hosted endpoint) for a structured damage report with confidence
  scores. NOTE: AI damage detection is assistive, not a guaranteed 100%
  accurate result — always confirm flagged/low-confidence items manually.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_riverpod: ^2.5.1

  # Camera / media capture
  camera: ^0.11.0+2
  image_picker: ^1.1.2
  video_player: ^2.9.1
  permission_handler: ^11.3.1

  # Networking
  dio: ^5.5.0+1

  # Secure storage for API keys / base URLs
  flutter_secure_storage: ^9.2.2

  # Local persistence (report history)
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.4

  # JSON models
  json_annotation: ^4.9.0

  # Utilities
  uuid: ^4.4.2
  intl: ^0.19.0
  image: ^4.2.0
  path: ^1.9.0
  share_plus: ^9.0.0
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/
